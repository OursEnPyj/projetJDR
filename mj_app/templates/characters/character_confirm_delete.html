{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2>Supprimer le personnage</h2>
  <div class="alert alert-warning">
    <p>Es-tu sûr de vouloir supprimer <strong>{{ character.name }}</strong> ?</p>
    <p>Cette action est irréversible.</p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'characters:character_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
